<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>dearsy</title>
<style>
  :root {
    --bg: #000;
    --panel: #0d0d0d;
    --card: #161616;
    --hover: #222;
    --text: #fff;
    --muted: #8a8a8a;
    --border: #262626;
    --invert: #000;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  button { font: inherit; color: inherit; }
  [data-lucide] { width: 18px; height: 18px; stroke-width: 2; }

  .app { display: grid; grid-template-columns: 220px 1fr; height: calc(100% - 92px); }

  /* ----- Заголовок: буквы танцуют под музыку ----- */
  .logo { display: flex; font-size: 1.6rem; font-weight: 800; letter-spacing: -.03em;
    margin: 0 8px 28px; user-select: none; }
  .logo span { display: inline-block; will-change: transform; transition: transform .08s linear; }

  /* ----- Боковое меню ----- */
  aside { background: var(--panel); padding: 24px 16px; border-right: 1px solid var(--border); }
  nav button { display: flex; width: 100%; align-items: center; gap: 12px; padding: 10px 12px;
    margin-bottom: 4px; background: none; border: none; border-radius: 8px; color: var(--muted);
    font-weight: 600; cursor: pointer; text-align: left; }
  nav button:hover { color: var(--text); background: var(--hover); }
  nav button.active { color: var(--invert); background: var(--text); }

  /* ----- Основная область ----- */
  main { overflow-y: auto; padding: 28px 32px; }
  .view { display: none; }
  .view.active { display: block; }
  h1 { font-size: 1.8rem; margin: 0 0 6px; letter-spacing: -.02em; }
  .sub { color: var(--muted); margin: 0 0 24px; }

  /* ----- Список треков ----- */
  .tracks { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  .actions { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
  .cloud { color: var(--muted); display: grid; place-items: center; width: 28px; height: 28px; }
  .cloud [data-lucide] { width: 16px; height: 16px; }
  .icon-btn.del:hover { background: #fff; color: #000; }
  #search { width: 100%; max-width: 420px; margin: 0 0 16px; font: inherit; color: var(--text);
    background: var(--card); border: 1px solid var(--border); border-radius: 999px; padding: 10px 16px; }
  #search:focus { outline: 2px solid var(--text); outline-offset: -1px; }
  .head, .track { display: grid; grid-template-columns: 44px 1fr 1fr auto; align-items: center;
    gap: 12px; padding: 10px 16px; }
  .head { color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .06em;
    border-bottom: 1px solid var(--border); }
  .track { border-bottom: 1px solid var(--border); cursor: pointer; transition: background .15s; }
  .track:last-child { border-bottom: none; }
  .track:hover { background: var(--hover); }
  .track.playing .title { text-decoration: underline; }
  .icon-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--card); display: grid; place-items: center; cursor: pointer; }
  .icon-btn:hover { background: var(--text); color: var(--invert); }
  .play-btn { background: var(--text); color: var(--invert); border: none; }
  .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .artist { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }

  /* ----- Форма загрузки ----- */
  form { display: grid; gap: 14px; max-width: 480px; background: var(--panel);
    padding: 24px; border-radius: 14px; border: 1px solid var(--border); }
  label { display: grid; gap: 6px; font-size: .85rem; color: var(--muted); font-weight: 600; }
  input[type=text], input[type=file] { font: inherit; color: var(--text); background: var(--card);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  input:focus { outline: 2px solid var(--text); outline-offset: -1px; }
  .primary { font-weight: 700; padding: 12px; border: none; border-radius: 999px;
    background: var(--text); color: var(--invert); cursor: pointer; }
  .primary:disabled { opacity: .4; cursor: default; }
  #status { min-height: 1.2em; font-size: .9rem; color: var(--muted); }

  /* ----- Плеер ----- */
  .player { height: 92px; background: var(--panel); border-top: 1px solid var(--border);
    display: grid; grid-template-columns: minmax(0, 260px) 1fr; align-items: center; gap: 24px;
    padding: 0 24px; }
  .now { min-width: 0; }
  .now .title { font-size: .95rem; }
  .controls { display: grid; gap: 8px; min-width: 0; }
  .buttons { display: flex; align-items: center; justify-content: center; gap: 14px; }
  .ctrl { background: none; border: none; cursor: pointer; color: var(--muted);
    width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; }
  .ctrl:hover { color: var(--text); background: var(--hover); }
  .ctrl.main { background: var(--text); color: var(--invert); width: 42px; height: 42px; }
  .ctrl.main:hover { background: #ccc; color: var(--invert); }
  .progress { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px;
    font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .volume { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }

  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 4px;
    border-radius: 999px; cursor: pointer; background: linear-gradient(to right,
      var(--text) var(--fill, 0%), #333 var(--fill, 0%)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px;
    border-radius: 50%; background: var(--text); border: none; }
  input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%;
    background: var(--text); border: none; }
  #volume { width: 90px; }

  .ctrl.on { color: var(--text); background: var(--hover); box-shadow: inset 0 0 0 1px var(--text); }
  #bass { width: 70px; }

  /* ----- Телефон ----- */
  @media (max-width: 640px) {
    .app { grid-template-columns: 1fr; height: calc(100% - 150px); }
    aside { padding: 12px 16px; border-right: none; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px; }
    .logo { margin: 0; font-size: 1.3rem; }
    nav { display: flex; gap: 8px; margin-left: auto; }
    nav button { width: auto; margin: 0; padding: 8px 12px; }
    nav button span.lbl { display: none; }
    main { padding: 20px 16px; }
    h1 { font-size: 1.5rem; }
    .head { display: none; }
    .track { grid-template-columns: 40px 1fr auto; }
    .track .artist { grid-column: 2; font-size: .85rem; }
    .track .icon-btn.dl { grid-row: 1; grid-column: 3; }
    .track .play-cell { grid-row: 1 / span 2; }
    .player { grid-template-columns: 1fr; height: auto; padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
      gap: 6px; }
    .now { text-align: center; }
    .progress { grid-template-columns: auto 1fr auto; }
    .volume { justify-content: center; }
    #volume, #bass { width: 110px; }
    .ctrl { width: 40px; height: 40px; }
    .ctrl.main { width: 48px; height: 48px; }
  }
</style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="logo" id="logo"></div>
      <nav>
        <button type="button" data-view="tracks" class="active"><i data-lucide="music"></i><span class="lbl">Треки</span></button>
        <button type="button" data-view="upload"><i data-lucide="upload"></i><span class="lbl">Загрузить</span></button>
      </nav>
    </aside>

    <main>
      <section id="view-tracks" class="view active">
        <h1>Треки</h1>
        <p class="sub">Нажмите трек, чтобы слушать. Значок <span style="display:inline-block;vertical-align:middle"><i data-lucide="cloud"></i></span> означает, что трек хранится в облаке dearsy и доступен с любого устройства.</p>
        <input type="search" id="search" placeholder="Поиск по названию или исполнителю">
        <div class="tracks">
          <div class="head"><span>#</span><span>Название</span><span>Исполнитель</span><span></span></div>
          <div id="list"></div>
        </div>
      </section>

      <section id="view-upload" class="view">
        <h1>Загрузить музыку</h1>
        <p class="sub">Аудиофайлы до 5 МБ.</p>
        <form id="upload-form">
          <label>Название
            <input type="text" id="title" required maxlength="200" placeholder="Например, Night Drive">
          </label>
          <label>Исполнитель
            <input type="text" id="artist" maxlength="200" placeholder="Необязательно">
          </label>
          <label>Аудиофайл
            <input type="file" id="file" accept="audio/*" required>
          </label>
          <button id="upload-btn" class="primary" type="submit">Загрузить трек</button>
          <div id="status"></div>
        </form>
      </section>
    </main>
  </div>

  <footer class="player">
    <div class="now">
      <div class="title" id="now-title">Ничего не играет</div>
      <div class="artist" id="now-artist"></div>
    </div>
    <div class="controls">
      <div class="buttons">
        <button class="ctrl" id="prev" title="Предыдущий"></button>
        <button class="ctrl main" id="playpause" title="Играть"></button>
        <button class="ctrl" id="next" title="Следующий"></button>
      </div>
      <div class="progress">
        <span id="cur">0:00</span>
        <input type="range" id="seek" min="0" max="0" step="0.1" value="0">
        <span id="dur">0:00</span>
      </div>
    </div>
    <div class="volume">
      <button class="ctrl" id="bass-btn" title="Bass booster"></button>
      <input type="range" id="bass" min="0" max="15" step="0.5" value="0" title="Сила баса, дБ">
      <button class="ctrl" id="mute" title="Звук"></button>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
    </div>
  </footer>

  <audio id="audio" preload="none" crossorigin="anonymous"></audio>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://hzteqafymqdvfqialdqk.supabase.co";
  const SUPABASE_KEY = "sb_publishable_Cip_U2xM0Q1XQYGmNmqJEg_eeegDtiH";
  const MAX_BYTES = 5 * 1024 * 1024;

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const $ = (id) => document.getElementById(id);
  const audio = $("audio");

  let tracks = [];
  let currentIndex = -1;
  let isLoading = false;

  // ----- Иконки Lucide -----
  function icons() { if (window.lucide) lucide.createIcons(); }
  function setIcon(el, name) { el.innerHTML = `<i data-lucide="${name}"></i>`; icons(); }

  // ----- Заголовок -----
  const WORD = "dearsy";
  $("logo").innerHTML = [...WORD].map((ch) => `<span>${ch}</span>`).join("");
  const letters = [...$("logo").children];

  // ----- Анализ звука: буквы танцуют под музыку -----
  let audioCtx, analyser, freq, bassNode;
  let bassDb = 0;
  function setupAnalyser() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = audioCtx.createMediaElementSource(audio);
    // Цепочка: звук -> bass booster (low shelf) -> анализатор -> динамики
    bassNode = audioCtx.createBiquadFilter();
    bassNode.type = "lowshelf";
    bassNode.frequency.value = 120;
    bassNode.gain.value = bassDb;
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    freq = new Uint8Array(analyser.frequencyBinCount);
    src.connect(bassNode);
    bassNode.connect(analyser);
    analyser.connect(audioCtx.destination);
  }

  // ----- Bass booster -----
  let bassLast = 8; // сила, которая вернётся при повторном включении
  function applyBass() {
    if (bassNode) bassNode.gain.value = bassDb;
    $("bass-btn").classList.toggle("on", bassDb > 0);
    $("bass").value = bassDb;
    paintFill($("bass"));
  }
  $("bass").addEventListener("input", (e) => {
    bassDb = parseFloat(e.target.value);
    if (bassDb > 0) bassLast = bassDb;
    applyBass();
  });
  $("bass-btn").onclick = () => {
    bassDb = bassDb > 0 ? 0 : bassLast;
    applyBass();
  };
  setIcon($("bass-btn"), "audio-lines");

  let phase = 0;
  let smoothLevel = 0;
  function animateLogo() {
    requestAnimationFrame(animateLogo);
    let target = 0;
    if (analyser && !audio.paused) {
      analyser.getByteFrequencyData(freq);
      // Низкие и средние частоты дают сильный ритм
      let sum = 0;
      for (let i = 0; i < 40; i++) sum += freq[i];
      target = sum / 40 / 255;
    }
    // Плавное изменение громкости, чтобы движение не дёргалось
    smoothLevel += (target - smoothLevel) * 0.2;
    // Когда звука нет, буквы стоят. Чем громче, тем быстрее скачет волна
    phase += smoothLevel * 0.35;
    const level = smoothLevel;
    letters.forEach((el, i) => {
      const wave = Math.sin(phase + i * 0.7);
      const lift = wave * level * 30;
      const scale = 1 + level * 0.25 * Math.max(0, wave);
      const tilt = wave * level * 14;
      el.style.transform = level < 0.01
        ? "none"
        : `translateY(${lift}px) scale(${scale}) rotate(${tilt}deg)`;
    });
  }
  animateLogo();

  // ----- Вкладки -----
  document.querySelectorAll("nav button").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("active", b === btn));
      document.querySelectorAll(".view").forEach((v) => v.classList.remove("active"));
      $("view-" + btn.dataset.view).classList.add("active");
      if (btn.dataset.view === "tracks") loadList();
    });
  });

  function setStatus(msg) { $("status").textContent = msg; }

  function fmt(sec) {
    if (!isFinite(sec)) return "0:00";
    const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return `${m}:${s.toString().padStart(2, "0")}`;
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(",")[1]);
      reader.onerror = () => reject(reader.error);
      reader.readAsDataURL(file);
    });
  }

  function base64ToBlob(b64, mime) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new Blob([bytes], { type: mime });
  }

  // ----- Список -----
  async function loadList() {
    const { data, error } = await db
      .from("tracks")
      .select("id, title, artist, mime_type")
      .order("created_at", { ascending: false });
    if (error) { $("list").innerHTML = `<div class="empty">Ошибка: ${error.message}</div>`; return; }
    tracks = data;
    renderList();
  }

  function renderList() {
    const list = $("list");
    list.innerHTML = "";
    if (!tracks.length) {
      list.innerHTML = '<div class="empty">Пока нет треков. Загрузите первый во вкладке «Загрузить».</div>';
      return;
    }
    const q = $("search").value.trim().toLowerCase();
    // Берём исходный индекс, чтобы next/prev работали по всему списку, а не по результатам поиска
    const shown = tracks
      .map((t, i) => ({ t, i }))
      .filter(({ t }) => !q || t.title.toLowerCase().includes(q) || (t.artist || "").toLowerCase().includes(q));
    if (!shown.length) {
      list.innerHTML = '<div class="empty">Ничего не найдено.</div>';
      return;
    }
    shown.forEach(({ t, i }) => {
      const row = document.createElement("div");
      row.className = "track" + (i === currentIndex ? " playing" : "");
      row.innerHTML = `
        <div class="play-cell"><button class="icon-btn play-btn" type="button"><i data-lucide="play"></i></button></div>
        <div class="title"></div>
        <div class="artist"></div>
        <div class="actions">
          <span class="cloud" title="Хранится в облаке dearsy"><i data-lucide="cloud"></i></span>
          <button class="icon-btn dl" type="button" title="Скачать"><i data-lucide="download"></i></button>
          ${mineIds.has(t.id) ? '<button class="icon-btn del" type="button" title="Удалить"><i data-lucide="trash-2"></i></button>' : ""}
        </div>`;
      row.querySelector(".title").textContent = t.title;
      row.querySelector(".artist").textContent = t.artist || "—";
      row.onclick = () => playIndex(i);
      row.querySelector(".dl").onclick = (e) => { e.stopPropagation(); download(t); };
      const del = row.querySelector(".del");
      if (del) del.onclick = (e) => { e.stopPropagation(); deleteTrack(t); };
      list.appendChild(row);
    });
    icons();
  }

  $("search").addEventListener("input", renderList);

  // ----- Владелец треков: токен хранится в этом браузере -----
  function uuid() {
    return ([1e7] + -1e3 + -4e3 + -8e3 + -1e11).replace(/[018]/g, (c) =>
      (c ^ (crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (c / 4)))).toString(16));
  }
  let ownerToken = localStorage.getItem("dearsy_owner");
  if (!ownerToken) { ownerToken = uuid(); localStorage.setItem("dearsy_owner", ownerToken); }
  const mineIds = new Set(JSON.parse(localStorage.getItem("dearsy_mine") || "[]"));
  function saveMine() { localStorage.setItem("dearsy_mine", JSON.stringify([...mineIds])); }

  async function deleteTrack(track) {
    if (!mineIds.has(track.id)) return;
    if (!confirm(`Удалить «${track.title}»? Это действие необратимо.`)) return;
    const { data: ok, error } = await db.rpc("delete_my_track", { p_id: track.id, p_token: ownerToken });
    if (error || !ok) { alert("Не удалось удалить: " + (error ? error.message : "трек не найден")); return; }

    mineIds.delete(track.id);
    saveMine();
    const curId = tracks[currentIndex] && tracks[currentIndex].id;
    tracks = tracks.filter((t) => t.id !== track.id);
    if (curId === track.id) {
      audio.pause();
      audio.removeAttribute("src");
      audio.load();
      currentIndex = -1;
      $("now-title").textContent = "Ничего не играет";
      $("now-artist").textContent = "";
    } else {
      currentIndex = tracks.findIndex((t) => t.id === curId);
    }
    renderList();
  }

  // ----- Скачивание -----
  async function download(track) {
    const { data, error } = await db
      .from("tracks")
      .select("audio_base64")
      .eq("id", track.id)
      .single();
    if (error) { alert("Ошибка: " + error.message); return; }

    const blob = base64ToBlob(data.audio_base64, track.mime_type);
    const ext = (track.mime_type.split("/")[1] || "mp3").replace("mpeg", "mp3");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `${track.artist ? track.artist + " - " : ""}${track.title}.${ext}`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  // ----- Воспроизведение -----
  async function playIndex(i) {
    if (i < 0 || i >= tracks.length || isLoading) return;
    isLoading = true;
    currentIndex = i;
    const t = tracks[i];
    $("now-title").textContent = t.title;
    $("now-artist").textContent = t.artist || "";
    renderList();

    const { data, error } = await db
      .from("tracks")
      .select("audio_base64")
      .eq("id", t.id)
      .single();
    isLoading = false;
    if (error) { alert("Ошибка: " + error.message); return; }

    audio.src = `data:${t.mime_type};base64,${data.audio_base64}`;
    setupAnalyser();
    if (audioCtx.state === "suspended") audioCtx.resume();
    audio.play();
  }

  function togglePlay() {
    if (!audio.src) { if (tracks.length) playIndex(0); return; }
    setupAnalyser();
    if (audioCtx.state === "suspended") audioCtx.resume();
    audio.paused ? audio.play() : audio.pause();
  }

  $("playpause").onclick = togglePlay;
  $("next").onclick = () => playIndex((currentIndex + 1) % tracks.length);
  $("prev").onclick = () => playIndex(currentIndex <= 0 ? tracks.length - 1 : currentIndex - 1);

  audio.addEventListener("play", () => setIcon($("playpause"), "pause"));
  audio.addEventListener("pause", () => setIcon($("playpause"), "play"));
  audio.addEventListener("ended", () => $("next").onclick());
  audio.addEventListener("loadedmetadata", () => {
    $("seek").max = audio.duration;
    $("dur").textContent = fmt(audio.duration);
  });
  audio.addEventListener("timeupdate", () => {
    $("seek").value = audio.currentTime;
    $("cur").textContent = fmt(audio.currentTime);
    paintFill($("seek"));
  });

  $("seek").addEventListener("input", (e) => {
    audio.currentTime = parseFloat(e.target.value);
    paintFill(e.target);
  });

  function paintFill(input) {
    const pct = (input.value - input.min) / (input.max - input.min || 1) * 100;
    input.style.setProperty("--fill", pct + "%");
  }
  $("volume").addEventListener("input", (e) => {
    audio.volume = parseFloat(e.target.value);
    audio.muted = audio.volume === 0;
    paintFill(e.target);
    setIcon($("mute"), audio.muted ? "volume-x" : "volume-2");
  });
  $("mute").onclick = () => {
    audio.muted = !audio.muted;
    setIcon($("mute"), audio.muted ? "volume-x" : "volume-2");
  };
  audio.volume = parseFloat($("volume").value);
  paintFill($("volume"));

  // ----- Загрузка -----
  $("upload-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const file = $("file").files[0];
    if (!file) return;
    if (!file.type.startsWith("audio/")) { setStatus("Нужен аудиофайл."); return; }
    if (file.size > MAX_BYTES) { setStatus("Файл больше 5 МБ."); return; }

    $("upload-btn").disabled = true;
    setStatus("Кодирую в Base64…");
    try {
      const audio_base64 = await fileToBase64(file);
      setStatus("Загружаю в базу…");
      const { data: row, error } = await db.from("tracks").insert({
        title: $("title").value.trim(),
        artist: $("artist").value.trim() || null,
        mime_type: file.type || "audio/mpeg",
        audio_base64,
        owner_token: ownerToken,
      }).select("id").single();
      if (error) throw error;
      mineIds.add(row.id);
      saveMine();
      e.target.reset();
      setStatus("Трек добавлен!");
    } catch (err) {
      setStatus("Ошибка: " + err.message);
    } finally {
      $("upload-btn").disabled = false;
    }
  });

  setIcon($("prev"), "skip-back");
  setIcon($("next"), "skip-forward");
  setIcon($("playpause"), "play");
  setIcon($("mute"), "volume-2");
  loadList();
</script>
</body>
</html>
